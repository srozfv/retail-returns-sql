services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: analyst
      POSTGRES_DB: portfolio
      POSTGRES_PASSWORD: local-demo-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analyst -d portfolio"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - .:/project:ro
    working_dir: /project
